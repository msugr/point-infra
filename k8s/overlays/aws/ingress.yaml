# ※ ADR-0014 로 Gateway API(Gateway + HTTPRoute)로 교체 예정 — 구현 단계에서 gateway.yaml 로 대체한다
#   (프론트 web 파드 라우팅 "/" 도 그때 추가, ADR-0015)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/inbound-cidrs: "49.163.124.220/32,183.98.203.186/32,52.78.206.18/32"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/events
            pathType: Prefix
            backend: { service: { name: event-service, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: monolith, port: { number: 80 } } }
