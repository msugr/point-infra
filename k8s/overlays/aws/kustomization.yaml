apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/monolith
  - ../../base/event-service-core              # ScaledObject(KEDA) 제외 — 테스트 환경
  - ../../base/infra
  - ingress.yaml
configMapGenerator:
  - name: monolith-config
    literals:
      - SPRING_PROFILES_ACTIVE=aws
      - KAFKA_ENABLED=true
      - DR_MODE=false
      - KAFKA_BOOTSTRAP=kafka:9092
  - name: event-config
    literals:
      - SPRING_PROFILES_ACTIVE=aws
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP=kafka:9092
patches:
  - target: { kind: Deployment, name: event-service }
    patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
      - op: remove
        path: /spec/template/spec/tolerations

images:
  - name: monolith
    newName: 906336681755.dkr.ecr.ap-northeast-2.amazonaws.com/monolith
    newTag: "0.1.0"
  - name: event-service
    newName: 906336681755.dkr.ecr.ap-northeast-2.amazonaws.com/event-service
    newTag: "0.1.0"
